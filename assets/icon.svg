<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#140d38"/>
      <stop offset="0.42" stop-color="#4e2263"/>
      <stop offset="0.72" stop-color="#a03a61"/>
      <stop offset="1"    stop-color="#e9764c"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#4dffa0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4dffa0" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#63d8ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#dusk)"/>

    <!-- aurora and first stars -->
    <path d="M -20 150 C 110 96, 250 130, 400 84 C 460 66, 500 74, 532 92 L 532 152
             C 480 128, 440 124, 386 142 C 250 188, 120 168, -20 210 Z"
          fill="url(#aurora)" opacity="0.55"/>
    <g fill="#fff7e6">
      <circle cx="64"  cy="66"  r="4"   opacity=".85"/>
      <circle cx="140" cy="40"  r="2.6" opacity=".6"/>
      <circle cx="214" cy="78"  r="3"   opacity=".7"/>
      <circle cx="452" cy="52"  r="3.4" opacity=".75"/>
      <circle cx="486" cy="140" r="2.4" opacity=".5"/>
      <circle cx="36"  cy="164" r="2.6" opacity=".55"/>
    </g>

    <!-- folded ears at the corners of a squarish head -->
    <path d="M 128 156 L 184 140 L 154 236 C 133 214, 122 186, 128 156 Z" fill="#2a282b"/>
    <path d="M 384 156 L 328 140 L 358 236 C 379 214, 390 186, 384 156 Z" fill="#2a282b"/>

    <!-- head: boxier than a round dog, which is most of the breed -->
    <path d="M 132 252 C 132 172, 188 134, 256 134 C 324 134, 380 172, 380 252
             C 380 306, 352 340, 310 352 L 202 352 C 160 340, 132 306, 132 252 Z"
          fill="#3d3b3e"/>
    <path d="M 132 250 C 138 182, 190 146, 256 146 C 322 146, 374 182, 380 250
             C 344 206, 306 190, 256 190 C 206 190, 168 206, 132 250 Z" fill="#333136"/>

    <!-- collar, mostly hidden behind the beard -->
    <path d="M 158 404 C 202 430, 310 430, 354 404 L 354 442 C 310 468, 202 468, 158 442 Z"
          fill="#f0a12e"/>
    <circle cx="256" cy="458" r="20" fill="#e8d38a"/>
    <circle cx="256" cy="458" r="6.5" fill="#b9741a" opacity=".55"/>

    <!-- the beard: hangs well below the jaw, tufted at the bottom -->
    <path d="M 188 268 L 324 268 C 340 324, 338 384, 306 412 L 296 392 L 276 418
             L 256 396 L 236 418 L 216 392 L 206 412 C 174 384, 172 324, 188 268 Z"
          fill="#cbc4b6"/>
    <path d="M 210 292 L 302 292 C 312 336, 310 372, 288 392 L 280 378 L 264 396
             L 248 396 L 232 378 L 224 392 C 202 372, 200 336, 210 292 Z"
          fill="#ded8cb" opacity=".7"/>

    <!-- nose and a small smile -->
    <ellipse cx="256" cy="292" rx="32" ry="23" fill="#17130f"/>
    <ellipse cx="246" cy="284" rx="9" ry="6" fill="#4a423c" opacity=".8"/>
    <path d="M 256 316 L 256 328 M 256 328 C 240 344, 224 336, 220 326
             M 256 328 C 272 344, 288 336, 292 326"
          stroke="#17130f" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- eyebrows, the whole point of a schnauzer -->
    <ellipse cx="198" cy="214" rx="50" ry="20" transform="rotate(-13 198 214)" fill="#d7d0c2"/>
    <ellipse cx="314" cy="214" rx="50" ry="20" transform="rotate(13 314 214)"  fill="#d7d0c2"/>

    <!-- eyes, peering out from under them -->
    <circle cx="206" cy="248" r="17" fill="#17130f"/>
    <circle cx="306" cy="248" r="17" fill="#17130f"/>
    <circle cx="212" cy="242" r="6" fill="#fff8ec" opacity=".92"/>
    <circle cx="312" cy="242" r="6" fill="#fff8ec" opacity=".92"/>

    <!-- a butterfly, mid-escape -->
    <g transform="translate(392 108) rotate(-14)">
      <ellipse cx="0" cy="0" rx="7" ry="26" fill="#2e2620"/>
      <path d="M -6 -10 C -46 -58, -74 -30, -58 4 C -46 30, -14 20, -6 6 Z" fill="#ef6f8a"/>
      <path d="M 6 -10 C 46 -58, 74 -30, 58 4 C 46 30, 14 20, 6 6 Z" fill="#ef6f8a"/>
      <path d="M -6 8 C -34 26, -44 54, -22 56 C -8 57, -4 32, -6 12 Z" fill="#f9b6c6"/>
      <path d="M 6 8 C 34 26, 44 54, 22 56 C 8 57, 4 32, 6 12 Z" fill="#f9b6c6"/>
      <circle cx="-40" cy="-16" r="8" fill="#fff1c9" opacity=".85"/>
      <circle cx="40"  cy="-16" r="8" fill="#fff1c9" opacity=".85"/>
      <path d="M -3 -24 C -12 -40, -22 -44, -28 -46 M 3 -24 C 12 -40, 22 -44, 28 -46"
            stroke="#2e2620" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
